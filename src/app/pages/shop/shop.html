@for (drink of drinks | async; track drink.id) {
  <div class="rounded-xl border bg-white p-4 shadow-sm">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold">{{ drink.name }}</h2>
        <p class="mt-2 text-gray-600">€{{ drink.price }}</p>
      </div>

      <button
        type="button"
        class="rounded-lg bg-black px-4 py-2 text-white"
        (click)="selectDrink(drink)"
      >
        Add
      </button>
    </div>
  </div>
}

@if (selectedDrink) {
  <section class="mt-8 rounded-xl border bg-white p-6">
    <h2 class="text-2xl font-semibold">
      {{ selectedDrink.name }}
    </h2>

    <p class="mt-1 text-gray-600">
      €{{ selectedDrink.price }}
    </p>

    <h3 class="mt-6 mb-3 font-semibold">
      Choose toppings:
    </h3>

    <div class="space-y-3">
      @for (topping of toppings | async; track topping.id) {
        <label class="flex items-center gap-3">
         <input
          type="checkbox"
          [checked]="selectedToppings.includes(topping)"
          (change)="toggleTopping(topping)"
        />

          <span>
            {{ topping.name }} €{{ topping.price }}
          </span>
        </label>
      }
    </div>

    <button
      type="button"
      class="mt-6 rounded-lg bg-black px-4 py-2 text-white"
      (click)="addToCart()"
    >
      Add to cart
    </button>
  </section>
}
