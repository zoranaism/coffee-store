<div class="p-8">
  <div class="mx-auto max-w-4xl">
    <div class="mb-8">
      <h1 class="text-3xl font-bold">
        Admin
      </h1>

      <p class="mt-2 text-gray-600">
        Manage the products available in your coffee store.
      </p>
    </div>

    <div class="grid gap-6 sm:grid-cols-2">
      <a
        routerLink="/admin/drinks"
        class="group rounded-xl border bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
      >
        <div
          class="mb-4 flex h-12 w-12 items-center justify-center rounded-lg bg-gray-100 text-2xl"
          aria-hidden="true"
        >
          ☕
        </div>

        <h2 class="text-xl font-semibold group-hover:underline">
          Manage Drinks
        </h2>

        <p class="mt-2 text-gray-600">
          Add, edit, or remove drinks from the store menu.
        </p>

        <span class="mt-5 inline-block font-medium">
          Manage drinks →
        </span>
      </a>

      <a
        routerLink="/admin/toppings"
        class="group rounded-xl border bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
      >
        <div
          class="mb-4 flex h-12 w-12 items-center justify-center rounded-lg bg-gray-100 text-2xl"
          aria-hidden="true"
        >
          ✨
        </div>

        <h2 class="text-xl font-semibold group-hover:underline">
          Manage Toppings
        </h2>

        <p class="mt-2 text-gray-600">
          Add, edit, or remove toppings customers can add to their drinks.
        </p>

        <span class="mt-5 inline-block font-medium">
          Manage toppings →
        </span>
      </a>
    </div>
  </div>
</div>
